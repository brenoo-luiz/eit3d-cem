# Three rows with different counts, senses and starting angles.
# Every electrode has the size set by the first row (16 electrodes, 50%),
# so the rows of 8 and 12 cover 25% and 37.5% of the cross section.
# θ in degrees, measured in the numbering sense from the line θ = 0.

[mesh]
aspect = 3.0  # cylinder height / radius

[electrodes]
coverage = 0.5  # of the cross section, by the first row
aspect = 2.0  # electrode height / width
top_margin = 0.4  # first row to the top
bottom_margin = 0.6  # last row to the bottom

[[electrodes.rows]]
count = 16
theta = 30.0
clockwise = true

[[electrodes.rows]]
count = 8
theta = 0.0
clockwise = false

[[electrodes.rows]]
count = 12
theta = 15.0
clockwise = false
